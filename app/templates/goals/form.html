{% extends 'base.html' %}{% block title %}{{ title }} · Finwise{% endblock %}{% block content %}<div class="page-header"><div><p class="eyebrow">Keep the future visible</p><h1>{{ title }}</h1><p class="muted">Update progress as life changes.</p></div><a class="button button-ghost" href="{{ url_for('goals.index') }}">Back to goals</a></div><section class="card form-card"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Goal name<input name="name" required value="{{ request.form.get('name', item.name or '') }}" placeholder="Emergency fund, new laptop…"></label><label>Target amount<input type="number" name="target_amount" min="0.01" step="0.01" required value="{{ request.form.get('target_amount', item.target_amount or '') }}"></label><label>Current progress<input type="number" name="current_amount" min="0" step="0.01" value="{{ request.form.get('current_amount', item.current_amount or '0') }}"></label><label>Deadline<span class="optional">optional</span><input type="date" name="deadline" value="{{ request.form.get('deadline', item.deadline.strftime('%Y-%m-%d') if item.deadline else '') }}"></label></div><div class="form-actions"><button class="button" type="submit">Save goal</button><a class="button button-ghost" href="{{ url_for('goals.index') }}">Cancel</a></div></form></section>{% endblock %}
