{% extends 'base.html' %}
{% block title %}Log in · Finwise{% endblock %}
{% block public_content %}<div class="auth-page"><a class="brand auth-brand" href="{{ url_for('auth.landing') }}"><img class="brand-logo" src="{{ url_for('static', filename='assets/logo.svg') }}" alt=""><span>finwise</span></a><div class="auth-card"><p class="eyebrow">Welcome back</p><h1>Pick up where you left off.</h1><p class="muted">Your dashboard is ready when you are.</p><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" autocomplete="current-password" required placeholder="Your password"></label><label class="check-row"><input type="checkbox" name="remember"> Remember me</label><button class="button button-wide" type="submit">Log in <span>→</span></button></form><p class="form-foot">New to finwise? <a href="{{ url_for('auth.register') }}">Create an account</a></p><div class="demo-note"><strong>Demo account</strong><span>demo@financebot.local · Demo@12345</span></div></div></div>{% endblock %}
