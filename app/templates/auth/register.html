{% extends 'base.html' %}
{% block title %}Create your account · Finwise{% endblock %}
{% block public_content %}<div class="auth-page"><a class="brand auth-brand" href="{{ url_for('auth.landing') }}"><img class="brand-logo" src="{{ url_for('static', filename='assets/logo.svg') }}" alt=""><span>finwise</span></a><div class="auth-card auth-card-wide"><p class="eyebrow">A fresh start</p><h1>Build a plan that fits your life.</h1><p class="muted">You can change these details anytime.</p><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Name<input name="name" autocomplete="name" required placeholder="Your name"></label><label>Email<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required placeholder="8+ characters"></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" required placeholder="Repeat your password"></label><label>Monthly income<input type="number" name="monthly_income" min="0" step="0.01" placeholder="0"></label><label>Currency<select name="currency"><option value="INR">₹ INR</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option></select></label><label class="full-span">What best describes you?<select name="user_type"><option value="salaried">Salaried professional</option><option value="student">College student</option><option value="freelancer">Freelancer</option><option value="household">Household manager</option></select></label></div><button class="button button-wide" type="submit">Create my plan <span>→</span></button></form><p class="form-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p></div></div>{% endblock %}
