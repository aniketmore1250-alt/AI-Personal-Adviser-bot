{% extends 'base.html' %}{% block title %}{{ title }} · Finwise{% endblock %}{% block content %}<div class="page-header"><div><p class="eyebrow">Cash in</p><h1>{{ title }}</h1><p class="muted">Keep the details lightweight; you can refine them later.</p></div><a class="button button-ghost" href="{{ url_for('income.index') }}">Back to income</a></div><section class="card form-card"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Source name<input name="source_name" required value="{{ request.form.get('source_name', item.source_name or '') }}" placeholder="Salary, Client A, Side project"></label><label>Amount<input type="number" name="amount" min="0.01" step="0.01" required value="{{ request.form.get('amount', item.amount or '') }}" placeholder="0.00"></label><label>Date<input type="date" name="date" required value="{{ request.form.get('date', item.date.strftime('%Y-%m-%d') if item.date else '') }}"></label><label>Notes<span class="optional">optional</span><input name="notes" value="{{ request.form.get('notes', item.notes or '') }}" placeholder="What is this income for?"></label></div><div class="form-actions"><button class="button" type="submit">Save income</button><a class="button button-ghost" href="{{ url_for('income.index') }}">Cancel</a></div></form></section>{% endblock %}
