{% extends 'base.html' %}{% block title %}{{ title }} · Finwise{% endblock %}{% block content %}<div class="page-header"><div><p class="eyebrow">Cash out</p><h1>{{ title }}</h1><p class="muted">A small amount of context makes future insights more useful.</p></div><a class="button button-ghost" href="{{ url_for('expenses.index') }}">Back to expenses</a></div><section class="card form-card"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Amount<input type="number" name="amount" min="0.01" step="0.01" required value="{{ request.form.get('amount', item.amount or '') }}" placeholder="0.00"></label><label>Date<input type="date" name="date" required value="{{ request.form.get('date', item.date.strftime('%Y-%m-%d') if item.date else '') }}"></label><label>Category<select name="category_id" required><option value="">Choose one</option>{% for category in categories %}<option value="{{ category.id }}" {% if request.form.get('category_id', item.category_id|string) == category.id|string %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Payment method<select name="payment_method"><option {% if request.form.get('payment_method', item.payment_method) == 'UPI' %}selected{% endif %}>UPI</option><option {% if request.form.get('payment_method', item.payment_method) == 'Card' %}selected{% endif %}>Card</option><option {% if request.form.get('payment_method', item.payment_method) == 'Cash' %}selected{% endif %}>Cash</option><option {% if request.form.get('payment_method', item.payment_method) == 'Bank transfer' %}selected{% endif %}>Bank transfer</option></select></label><label class="full-span">Description<span class="optional">optional</span><input name="description" value="{{ request.form.get('description', item.description or '') }}" placeholder="What was this for?"></label></div><div class="form-actions"><button class="button" type="submit">Save expense</button><a class="button button-ghost" href="{{ url_for('expenses.index') }}">Cancel</a></div></form></section>{% endblock %}
