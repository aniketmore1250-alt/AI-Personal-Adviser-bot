{% extends 'base.html' %}{% block title %}Profile · Finwise{% endblock %}{% block content %}<div class="page-header"><div><p class="eyebrow">Your context</p><h1>Profile</h1><p class="muted">The better we understand your context, the more useful your guidance becomes.</p></div></div><section class="card form-card"><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Name<input name="name" required value="{{ current_user.name }}"></label><label>Email<input type="email" name="email" required value="{{ current_user.email }}"></label><label>Monthly income<input type="number" name="monthly_income" min="0" step="0.01" value="{{ current_user.monthly_income or 0 }}"></label><label>Savings target<input type="number" name="savings_target" min="0" step="0.01" value="{{ current_user.savings_target or 0 }}"></label><label>Currency<select name="currency"><option value="INR" {% if current_user.currency == 'INR' %}selected{% endif %}>₹ INR</option><option value="USD" {% if current_user.currency == 'USD' %}selected{% endif %}>$ USD</option><option value="EUR" {% if current_user.currency == 'EUR' %}selected{% endif %}>€ EUR</option><option value="GBP" {% if current_user.currency == 'GBP' %}selected{% endif %}>£ GBP</option></select></label><label>Scenario<select name="user_type"><option value="salaried" {% if current_user.user_type == 'salaried' %}selected{% endif %}>Salaried professional</option><option value="student" {% if current_user.user_type == 'student' %}selected{% endif %}>College student</option><option value="freelancer" {% if current_user.user_type == 'freelancer' %}selected{% endif %}>Freelancer</option><option value="household" {% if current_user.user_type == 'household' %}selected{% endif %}>Household manager</option></select></label><label class="full-span">Financial goals<span class="optional">optional</span><textarea name="financial_goals" rows="4" placeholder="What are you working toward?">{{ current_user.financial_goals }}</textarea></label></div><div class="form-actions"><button class="button" type="submit">Save profile</button><a class="button button-ghost" href="{{ url_for('dashboard.index') }}">Cancel</a></div></form></section>{% endblock %}
